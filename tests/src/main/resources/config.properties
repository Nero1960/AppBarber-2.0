# ==========================================
# Configuración general de entorno
# Cambia a env=qa para correr contra Render/TiDB
# ==========================================
env=local

# ==========================================
# URLs de API por entorno
# ==========================================
api.base.url.local=http://localhost:4000/api
api.base.url.qa=https://appbarberqabackend.onrender.com/api

# ==========================================
# URLs de UI (Playwright) por entorno
# ==========================================
ui.base.url.local=http://localhost:5173
ui.base.url.qa=https://appbarber-staging.onrender.com

# ==========================================
# Acceso a Base de Datos
# ==========================================
# BD - LOCAL (Contenedor MySQL)
db.host.local=localhost
db.port.local=3307
db.name.local=appsalon
db.user.local=root
db.password.local=root

# BD - QA (AWS TiDB)
# Las credenciales de QA se leen desde variables de entorno:
#   DB_USER_QA, DB_PASSWORD_QA
# (ej: setx DB_USER_QA "usuario" && setx DB_PASSWORD_QA "clave")
db.host.qa=gateway01.us-east-1.prod.aws.tidbcloud.com
db.port.qa=4000
db.name.qa=barber-app-tst

# ==========================================
# Credenciales de usuarios para tests UI
# Se puede sobrescribir con USERS_APP_EMAIL, USERS_APP_PASSWORD,
# USERS_ADMIN_EMAIL, USERS_ADMIN_PASSWORD
# ==========================================
users.app.email=carlos@correo.com
users.app.password=12345678
users.admin.email=admin@correo.com
users.admin.password=123456789

# ==========================================
# Opciones de Ejecución Playwright/RestAssured
# ==========================================
browser.headless=true
timeout=5000