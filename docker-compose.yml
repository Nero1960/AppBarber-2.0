version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: always
    container_name: barber_db
    env_file:
      - ./server/.env
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: server
    ports:
      - "4000:4000"
    depends_on:
      - db
    env_file:
      - ./server/.env
    volumes:
      - ./server:/app
      - /app/node_modules

  client:
    build: ./client
    container_name: client
    ports:
      - "5173:5173"
    depends_on:
      - server
    env_file:
      - ./client/.env
    volumes:
      - ./client:/app
      - /app/node_modules
  
volumes:
  db_data:

